[package]
name = "nle-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
# Test-only bridge for cross-crate headless compositor qualifications. It is
# intentionally not enabled by production nle-render consumers.
qualification = []

[dependencies]
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
wgpu.workspace = true
nle-compositor = { path = "../nle-compositor" }

[dev-dependencies]
naga = { version = "=29.0.4", features = ["wgsl-in"] }
pollster.workspace = true
serde.workspace = true
serde_json.workspace = true
nle-timeline = { path = "../nle-timeline" }
