name: macOS foundation

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  macos-arm64:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned LGPL FFmpeg
        run: ./scripts/build-ffmpeg-lgpl-macos.sh
      - name: Configure FFmpeg build environment
        run: |
          echo "FFMPEG_DIR=$GITHUB_WORKSPACE/.deps/ffmpeg-project-8.1-macos-arm64" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$GITHUB_WORKSPACE/.deps/ffmpeg-project-8.1-macos-arm64/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "DYLD_FALLBACK_LIBRARY_PATH=$GITHUB_WORKSPACE/.deps/ffmpeg-project-8.1-macos-arm64/lib" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib" >> "$GITHUB_ENV"
          echo "$GITHUB_WORKSPACE/.deps/ffmpeg-project-8.1-macos-arm64/bin" >> "$GITHUB_PATH"
      - name: Generate real H.264 and AAC test media
        run: |
          "$FFMPEG_DIR/bin/ffmpeg" -hide_banner -loglevel error -y \
            -f lavfi -i testsrc2=size=640x360:rate=24 \
            -f lavfi -i sine=frequency=440:sample_rate=48000 \
            -t 20 -c:v h264_videotoolbox -allow_sw 1 -pix_fmt yuv420p -c:a aac \
            "$RUNNER_TEMP/maelstrom-test.mp4"
          echo "MAELSTROM_TEST_MEDIA=$RUNNER_TEMP/maelstrom-test.mp4" >> "$GITHUB_ENV"
      - name: Test workspace
        run: cargo test --workspace
      - name: Lint workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Package, sign, and smoke-test app
        run: ./scripts/package-macos.sh
      - name: Archive signed application bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/Maelstrom-macOS-arm64/Maelstrom.app \
            dist/Maelstrom-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Maelstrom-macOS-arm64
          path: |
            dist/Maelstrom-macOS-arm64.zip
            dist/last-startup-smoke-macos.json
            dist/last-surface-submission-smoke-macos.json
            dist/last-media-acceptance-smoke-macos.json
          if-no-files-found: error
