[workspace]
members = [
    "crates/nle-app",
    "crates/nle-audio",
    "crates/nle-cache",
    "crates/nle-compositor",
    "crates/nle-decode",
    "crates/nle-export",
    "crates/nle-render",
    "crates/nle-project-io",
    "crates/nle-proxy",
    "crates/nle-timeline",
    "crates/nle-title",
    "crates/nle-ui-core",
    "crates/nle-upscale",
    "crates/nle-waveform",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
ab_glyph = "=0.2.32"
bytemuck = { version = "=1.25.2", features = ["derive"] }
glam = "=0.33.5"
image = { version = "=0.25.10", default-features = false, features = [
    "png", "jpeg", "webp", "tiff", "bmp", "tga", "gif", "exr",
] }
pollster = "=1.0.1"
rfd = "=0.17.2"
egui = "=0.35.0"
egui-wgpu = "=0.35.0"
egui-winit = "=0.35.0"
ffmpeg-next = "=8.1.0"
cpal = "=0.15.3"
wgpu = "=29.0.4"
winit = "=0.30.13"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"
